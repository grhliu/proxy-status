<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代理节点状态</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e8e8e8; margin: 0; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1a1d24; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #555; }
  .card.up { border-left-color: #34c759; }
  .card.down { border-left-color: #ff453a; }
  .name { font-size: 17px; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .up .dot { background: #34c759; }
  .down .dot { background: #ff453a; }
  .desc { color: #aaa; font-size: 13px; margin-top: 6px; }
  .meta { color: #888; font-size: 12px; margin-top: 6px; }
  .ok { color: #34c759; } .bad { color: #ff453a; }
  #updated { color: #666; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<h1>代理节点状态</h1>
<div class="sub">每 30 秒自动检测一次 · 只测端口通不通，不含任何账号密码</div>
<div id="list">检测中…</div>
<div id="updated"></div>
<script>
function render(data) {
  var el = document.getElementById('list');
  el.innerHTML = data.map(function (n) {
    var cls = n.ok ? 'up' : 'down';
    var status = n.ok
      ? '<span class="ok">正常 · ' + n.ms + 'ms</span>'
      : '<span class="bad">不通' + (n.error ? ' · ' + n.error : '') + '</span>';
    return '<div class="card ' + cls + '">'
      + '<div class="name"><span class="dot"></span>' + n.name + ' — ' + status + '</div>'
      + '<div class="desc">' + n.desc + '</div>'
      + '<div class="meta">' + n.host + ':' + n.port + '</div>'
      + '</div>';
  }).join('');
  document.getElementById('updated').textContent = '最后检测：' + new Date().toLocaleString();
}
function load() {
  fetch('/api/status').then(function (r) { return r.json(); }).then(render)
    .catch(function () { document.getElementById('list').textContent = '检测失败，稍后重试'; });
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
